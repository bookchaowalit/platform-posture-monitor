name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Shared Python CI: Ruff (ruff.toml) and the unittest suite. The package is standard library
  # only, so there is nothing to install or lock, and no type checker config yet.
  python:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.13"
      format-check: false # follow-up: adopt ruff format
      typecheck-command: ""
      test-command: python -m unittest discover -s tests -v

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
